name: Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_build:
        description: "Also attempt signed release AAB (needs Android secrets)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
      TEMPLATES_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
      GODOT_BIN: /home/runner/work/_temp/godot
      TEMPLATE_DIR: /home/runner/work/_temp/export_templates/4.7.2-stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          target: 35
          build-tools: 35.0.0

      - name: Download Godot 4.7.2 binary + export templates
        run: |
          curl -fsSL -o godot.zip "${GODOT_URL}"
          unzip -q godot.zip -d "$RUNNER_TEMP"
          chmod +x "${GODOT_BIN}"
          rm -f godot.zip
          "${GODOT_BIN}" --version | head -1
          mkdir -p "${TEMPLATE_DIR}"
          curl -fsSL -o templates.tpz "${TEMPLATES_URL}"
          mkdir -p templates_tmp && unzip -q -o templates.tpz -d templates_tmp
          cp -r templates_tmp/android_debug templates_tmp/android_release "${TEMPLATE_DIR}/"
          rm -rf templates_tmp templates.tpz

      - name: Configure release signing from secrets (optional)
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "${GITHUB_OUTPUT}"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "${GITHUB_ENV}"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ secrets.ANDROID_RELEASE_KEYSTORE_USER }}" >> "${GITHUB_ENV}"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASS=${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" >> "${GITHUB_ENV}"
            echo "release_signing=configured" >> "${GITHUB_OUTPUT}"
          else
            echo "release_signing=skipped (no ANDROID_RELEASE_KEYSTORE_* secrets)" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Android build template and export debug APK
        run: |
          "${GODOT_BIN}" --headless --path "${{ github.workspace }}" \
            --install-android-build-template \
            --export-debug "Android Debug (APK)" build/skyfall-debug.apk
          ls -la build/skyfall-debug.apk

      - name: Export signed release AAB
        if: steps.signing.outputs.release_signing == 'configured' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_build == 'true')
        run: |
          "${GODOT_BIN}" --headless --path "${{ github.workspace }}" \
            --export-release "Android Release (AAB)" build/skyfall-release.aab
          ls -la build/skyfall-release.aab
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/skyfall-debug.apk
            build/skyfall-release.aab
          retention-days: 30
